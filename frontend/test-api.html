<!DOCTYPE html>
<html>

<head>
    <title>API Test</title>
</head>

<body>
    <h1>API Connection Test</h1>
    <button onclick="testAPI()">Test Mashup Generation</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';

            try {
                const response = await fetch('http://localhost:3002/api/mashup/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        options: {}
                    })
                });

                const data = await response.json();

                if (data.success) {
                    resultDiv.innerHTML = `<h2>✅ SUCCESS!</h2><p>Generated: ${data.data.idea.appName}</p>`;
                } else {
                    resultDiv.innerHTML = `<h2>❌ API Error</h2><p>${data.error.message}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<h2>❌ Connection Error</h2><p>${error.message}</p>`;
            }
        }
    </script>
</body>

</html>
